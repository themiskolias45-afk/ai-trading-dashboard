; MT5 startup configuration — attaches EA_CRT_AMD_Dashboard_v355 to a XAUUSD chart.
;
; WHY THIS FILE EXISTS. The EA stopped on 2026-09-04 at 14:11 and never came back. It
; did not crash and it did not fail to compile: at 14:22 the charts were replaced by
; TK_SMART_ENTRY_v3.22 on BTCUSD M15, and the CRT EA has not written a line since.
; The reason it could not recover on its own is that this terminal has NO `profiles`
; directory at all — MT5 had nothing to restore a chart or an attached EA from, so every
; start came up bare. tasks/mt5_ensure_running.ps1 keeps the TERMINAL alive and only
; REPORTS eaAttached; it never attaches. Monitoring without recovery, again.
;
; This makes the attach part of startup itself, so it no longer depends on a profile
; being saved. mt5_ensure_running.ps1 passes this file whenever it starts MT5, which is
; what makes the EA genuinely 24/7 rather than "until the next restart".
;
; NO PASSWORD AND NO [Common] SECTION. The terminal is already authorised on account
; 11581419 (VantageMarkets-Demo) and stays that way; putting credentials in a file on
; disk would be a worse problem than the one this solves.
;
; PARAMETERS ARE THE COMPILED DEFAULTS, DELIBERATELY. v3.55 already ships the measured
; configuration and no .set file is needed or wanted:
;   InpUseTrailingStop = false   measured 2026-09-04 — ON -15.28 GBP / OFF +536.27,
;                                PF 1.00 -> 1.18, maxDD 9.71% -> 6.77%
;   InpUseFixedLot     = false   the v3.53 landmine (fixed-lot ON by default) is gone
;   InpRiskPercent     = 0.50
;   InpUsePortfolioMode= false   so it trades the CHART symbol only — gold only, which
;                                is what the measurement covers. EURUSD was -513 and the
;                                full portfolio -746, so portfolio mode must stay off.
;   InpMagicNumber     = 26070455  distinct from the SmartEntry bridge and the executor
; A .set file would silently override these with whatever was last saved in a GUI, which
; is exactly how the fixed-lot landmine got armed the first time.

[Experts]
AllowLiveTrading=true
Enabled=true
Account=false
Profile=false

[Chart]
Symbol=XAUUSD
Period=H1
Expert=EA_CRT_AMD_Dashboard_v355
