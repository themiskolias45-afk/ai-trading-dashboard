app = "ai-trading-dashboard"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    port = 3001
    type = "http"
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "get"
    path = "/api/health"

[[mounts]]
  source = "smartentry_data"
  destination = "/data"
