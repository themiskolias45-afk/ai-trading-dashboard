<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartEntry Pro — Robustness Report</title>
  <link rel="stylesheet" href="/dashboard/theme.css">
  <link rel="stylesheet" href="/dashboard/nav.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Tokens come from theme.css, linked above. This page used to redefine the
       whole palette here, which meant it kept the pre-audit --muted-dim
       (#4a6080: 4.34:1 on --bg, 3.56:1 on --surface3) long after theme.css
       raised it, and it drifted from the other pages on every later change.
       One source of truth. Page-specific colours stay below. */
    body { background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; font-size:14px; }
    header {
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:12px 24px; display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:10px;
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-mark {
      width:32px; height:32px; background:linear-gradient(135deg,var(--accent),#4f46e5);
      border-radius:8px; display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:16px; color:#fff;
    }
    .logo-text { font-size:1rem; font-weight:700; }
    .logo-sub  { font-size:.65rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
    .pill { padding:4px 12px; border-radius:20px; font-size:.72rem; font-weight:700;
            background:var(--surface); border:1px solid var(--border2); color:var(--muted); }

    .container { padding:20px 24px; max-width:1400px; margin:0 auto; }

    h1 { font-size:1.4rem; font-weight:800; letter-spacing:-.01em; }
    .sub-line { font-size:.75rem; color:var(--muted); margin-top:5px; line-height:1.6; }

    .banner {
      background:#1a160a; border:1px solid var(--yellow); border-radius:8px;
      padding:11px 16px; margin:14px 0 18px; font-size:.74rem; color:var(--yellow); line-height:1.65;
    }
    .banner strong { color:#fde68a; }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:10px;
            overflow:hidden; margin-bottom:16px; }
    .card-head { padding:11px 16px; border-bottom:1px solid var(--border); font-size:.78rem;
                 font-weight:700; display:flex; justify-content:space-between; align-items:center;
                 gap:10px; flex-wrap:wrap; }
    .card-head .sub { font-size:.67rem; font-weight:400; color:var(--muted); }
    .card-body { padding:14px 16px; }

    .grid2 { display:grid; grid-template-columns:1.55fr 1fr; gap:16px; }
    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    @media(max-width:1050px){ .grid2,.grid3{ grid-template-columns:1fr; } }

    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
    .stat { background:var(--surface); border:1px solid var(--border2); border-radius:9px;
            padding:13px 15px; text-align:center; }
    .stat .v { font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; }
    .stat .l { font-size:.63rem; color:var(--muted); margin-top:4px; line-height:1.4; }

    svg { display:block; width:100%; height:auto; }
    .axis { font-size:9px; fill:var(--muted-dim); }

    table { border-collapse:collapse; width:100%; font-size:.72rem; }
    th { text-align:center; padding:5px 4px; font-size:.6rem; text-transform:uppercase;
         letter-spacing:.07em; color:var(--muted); font-weight:700; }
    td { padding:4px 3px; text-align:center; font-variant-numeric:tabular-nums; }
    td.yr { text-align:left; color:var(--muted); font-weight:700; padding-left:6px; }
    td.tot { font-weight:800; padding-left:8px; }
    .cell { border-radius:3px; padding:3px 2px; display:block; font-size:.66rem; }

    .note { background:#0b1119; border:1px solid var(--border2); border-radius:8px;
            padding:12px 16px; font-size:.71rem; color:var(--muted); line-height:1.75; }
    .note strong { color:var(--text); }
    .loading { padding:40px 16px; text-align:center; color:var(--muted); font-size:.8rem; }
    .pos { color:var(--green); } .neg { color:var(--red); } .dim { color:var(--muted); }
  </style>
  <script src="/dashboard/nav.js" defer></script>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">SE</div>
    <div>
      <div class="logo-text">SmartEntry Pro</div>
      <div class="logo-sub">Robustness Report</div>
    </div>
  </div>
  <div class="pill" id="hdr-meta">loading…</div>
</header>

<div class="container" id="root">
  <div class="loading">reading the replay…</div>
</div>

<script>
"use strict";

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function f1(v){ return (v>=0?"+":"") + Number(v).toFixed(1); }
function money(v){ return "$" + Math.round(v).toLocaleString(); }

// ── the Monte-Carlo fan ─────────────────────────────────────────────────────
// Bands are drawn from the percentile columns the harness already computed; the
// page never resamples anything itself.
function fanSvg(fan) {
  if (!fan || fan.length < 2) return '<div class="dim">no fan data</div>';
  var W = 760, H = 300, PL = 58, PR = 10, PT = 12, PB = 26;
  var maxT = fan[fan.length-1].trade || 1;
  var hi = 0;
  fan.forEach(function(p){ hi = Math.max(hi, p.p95, p.actual); });
  hi = hi * 1.04;
  var x = function(t){ return PL + (t/maxT) * (W-PL-PR); };
  var y = function(v){ return PT + (1 - v/hi) * (H-PT-PB); };

  function band(loKey, hiKey, fill, op) {
    var up = fan.map(function(p){ return x(p.trade)+","+y(p[hiKey]); }).join(" ");
    var dn = fan.slice().reverse().map(function(p){ return x(p.trade)+","+y(p[loKey]); }).join(" ");
    return '<polygon points="'+up+" "+dn+'" fill="'+fill+'" opacity="'+op+'"/>';
  }
  function line(key, stroke, w) {
    return '<polyline points="'+fan.map(function(p){ return x(p.trade)+","+y(p[key]); }).join(" ")
         + '" fill="none" stroke="'+stroke+'" stroke-width="'+w+'"/>';
  }
  var ticks = "";
  for (var k=0;k<=4;k++){
    var v = hi*k/4;
    ticks += '<line x1="'+PL+'" y1="'+y(v)+'" x2="'+(W-PR)+'" y2="'+y(v)+'" stroke="#1a2235"/>'
          +  '<text class="axis" x="'+(PL-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+money(v)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'
    + ticks
    + band("p5","p95","#3b82f6",0.13)
    + band("p25","p75","#3b82f6",0.26)
    + line("p50","#e2e8f0",1.4)
    + line("actual","#eab308",2)
    + '<text class="axis" x="'+PL+'" y="'+(H-8)+'">0</text>'
    + '<text class="axis" x="'+(W-PR)+'" y="'+(H-8)+'" text-anchor="end">'+maxT+' trades</text>'
    + '</svg>';
}

// ── a histogram, with the actual result marked ──────────────────────────────
function histSvg(h, colour, actual, unit) {
  if (!h || !h.counts) return '<div class="dim">no data</div>';
  var W = 360, H = 190, PL = 34, PR = 8, PT = 10, PB = 24;
  var max = Math.max.apply(null, h.counts) || 1;
  var bw = (W-PL-PR) / h.counts.length;
  var bars = h.counts.map(function(c,i){
    var bh = (c/max)*(H-PT-PB);
    return '<rect x="'+(PL+i*bw)+'" y="'+(H-PB-bh)+'" width="'+Math.max(1,bw-1)+'" height="'+bh+'" fill="'+colour+'"/>';
  }).join("");
  var mark = "";
  if (actual !== null && actual !== undefined && isFinite(actual)) {
    var ax = PL + ((actual - h.lo)/(h.hi - h.lo))*(W-PL-PR);
    if (ax >= PL && ax <= W-PR) {
      mark = '<line x1="'+ax+'" y1="'+PT+'" x2="'+ax+'" y2="'+(H-PB)+'" stroke="#eab308" stroke-width="2"/>'
           + '<text class="axis" x="'+(ax+4)+'" y="'+(PT+10)+'" fill="#eab308">actual</text>';
    }
  }
  return '<svg viewBox="0 0 '+W+' '+H+'">'+bars+mark
    + '<text class="axis" x="'+PL+'" y="'+(H-8)+'">'+h.lo.toFixed(0)+unit+'</text>'
    + '<text class="axis" x="'+(W-PR)+'" y="'+(H-8)+'" text-anchor="end">'+h.hi.toFixed(0)+unit+'</text>'
    + '</svg>';
}

// ── the monthly heat map ────────────────────────────────────────────────────
function heat(rows) {
  var M = ["J","F","M","A","M","J","J","A","S","O","N","D"];
  var head = "<tr><th></th>" + M.map(function(m){ return "<th>"+m+"</th>"; }).join("") + "<th>year</th></tr>";
  var body = rows.map(function(r){
    var cells = r.months.map(function(v){
      if (v === null) return '<td class="dim">·</td>';
      // Colour saturates at 15% so one outlier month cannot wash the whole map out.
      var a = Math.min(Math.abs(v)/15, 1) * 0.75 + 0.12;
      var bg = v >= 0 ? "rgba(34,197,94," + a.toFixed(2) + ")" : "rgba(239,68,68," + a.toFixed(2) + ")";
      return '<td><span class="cell" style="background:'+bg+'">'+(v>=0?"+":"")+v.toFixed(0)+'</span></td>';
    }).join("");
    var yc = r.yearPct === null ? '<td class="dim">—</td>'
           : '<td class="tot '+(r.yearPct>=0?"pos":"neg")+'">'+f1(r.yearPct)+'%</td>';
    return "<tr><td class='yr'>"+r.year+"</td>"+cells+yc+"</tr>";
  }).join("");
  return "<table><thead>"+head+"</thead><tbody>"+body+"</tbody></table>";
}

function render(d, meta) {
  var s = d.simulated, a = d.actual;
  meta = meta || {};
  document.getElementById("hdr-meta").textContent =
    d.trades + " replayed trades · gate " + d.params.gate;

  var html = ""
    + '<h1>Robustness &amp; Monte-Carlo</h1>'
    + '<div class="sub-line">' + esc(d.params.sims.toLocaleString())
    + ' bootstrap resamples of the trade history · ' + esc(d.span.from) + ' – ' + esc(d.span.to)
    + ' · risk ' + d.params.riskPct + '% per trade · costs ' + d.params.costR + 'R</div>'

    // WHEN this was computed, and whether that is recent enough to act on. ageHours
    // was in the payload from the start and nothing rendered it, so a five-day-old
    // report read exactly like this morning's on the page used to judge the system.
    + '<div class="sub-line">computed ' + esc(meta.generatedAt ? new Date(meta.generatedAt).toLocaleString() : 'at an unknown time')
    + (meta.ageHours === null || meta.ageHours === undefined ? ' · age unknown'
        : ' · ' + (meta.ageHours < 48 ? meta.ageHours + 'h' : (meta.ageHours / 24).toFixed(1) + ' days') + ' old')
    + '</div>'
    // THE CONFIG THIS REPORT RAN UNDER. Two reports with identical params can be
    // produced by materially different engines: on 2026-08-30 the 08-25 run showed a
    // 43.6% chance of profit over 227 trades and the next run showed 97.1% over 302,
    // on the same gate, risk, sims and costs - because momentumRsiMax had drifted from
    // 72 to 88 underneath. Without this line the two look comparable and are not.
    // WHAT THIS REPORT EXCLUDED. The headline is computed on the resolved remainder:
    // every EXPIRED trade - still open at MAX_HOLD - is DROPPED, not scored flat. That
    // was invisible on the page and absent from the artifact, so a chance-of-profit
    // over a filtered sample read as one over the whole population.
    // THE HORIZON IS ALWAYS SHOWN NOW, NOT ONLY WHEN IT IS BADLY WRONG.
    //
    // This used to render only when more than 20% of trades were dropped, so a report at
    // the correct horizon and a report at the wrong one looked IDENTICAL on the page -
    // and the wrong one was the default for the entire life of this report. MAX_HOLD is
    // the single parameter that moved every headline here by more than a factor of two:
    //
    //     40 bars   avgR 0.153   win 35.8%   return  90.6%   maxDD 28.4%   180 dropped
    //    320 bars   avgR 0.341   win 42.7%   return 382.0%   maxDD 12.3%     6 dropped
    //
    // Same trades, same engine, same day. A page that shows the result without the ruler
    // is asking to be misread, so the ruler now sits above the numbers either way -
    // green when it matches live behaviour, red when it does not.
    + (function(h){
        if (!h) return '';
        var per = Object.keys(h.perAsset || {}).map(function(k){
          var v = h.perAsset[k];
          return esc(k) + ' ' + v.expired + '/' + (v.expired + v.resolved);
        }).join(' · ');
        var matches = h.matchesLiveBehaviour === true
                      || (h.matchesLiveBehaviour == null && h.maxHoldBars >= 320);
        if (!matches) {
          return '<div class="banner" style="border-color:var(--red);color:var(--red);background:#1a0a0a">'
            + '<strong>MEASURED AT MAX_HOLD=' + h.maxHoldBars + ' H4 BARS, WHICH IS NOT HOW THIS SYSTEM TRADES.</strong> '
            + 'The live system has no max-hold — there is no time-based close in the bridge — so a trade still '
            + 'open at the cap is <em>unresolved</em>, not a loss, and it is DROPPED rather than scored flat. '
            + h.expiredDropped + ' of ' + h.ofGated + ' (' + h.sharePct + '%) were excluded here: ' + per + '. '
            + 'The exclusion is not neutral: an unresolved trade is disproportionately a winner still running, so '
            + 'every number below is biased <strong>downward</strong>. On this same data 40 bars reported avgR 0.153 '
            + 'against 0.341 at 320. Re-run with <code>MTF_MAX_HOLD=320</code>.</div>';
        }
        return '<div class="banner" style="border-color:#2e7d32;color:#7ee2a8;background:#0a1a0d">'
          + '<strong>Measured at MAX_HOLD=' + h.maxHoldBars + ' H4 bars — this matches live behaviour.</strong> '
          + 'The live system has no max-hold, so a long cap is what lets trades resolve the way they actually do. '
          + 'Only ' + h.expiredDropped + ' of ' + h.ofGated + ' (' + h.sharePct + '%) were still open at the cap '
          + 'and excluded: ' + per + '. '
          + 'For scale, this report defaulted to 40 bars until 2026-09-05, which dropped 180 trades and reported '
          + 'avgR 0.153 where 320 reports 0.341 on the same data.</div>';
      })(meta.horizon)
    + (function(c){
        if (!c || !c.available) return '';
        var drift = [];
        if (c.momentumRsiMax != null && c.defaults && c.momentumRsiMax !== c.defaults.momentumRsiMax)
          drift.push('momentumRsiMax ' + c.momentumRsiMax + ' (default ' + c.defaults.momentumRsiMax + ')');
        if (c.trendFollowRsiMax != null && c.defaults && c.trendFollowRsiMax !== c.defaults.trendFollowRsiMax)
          drift.push('trendFollowRsiMax ' + c.trendFollowRsiMax + ' (default ' + c.defaults.trendFollowRsiMax + ')');
        var line = '<div class="sub-line">engine config: gate ' + esc(c.confidenceThreshold)
          + ' · momentumRsiMax ' + esc(c.momentumRsiMax) + ' · trendFollowRsiMax ' + esc(c.trendFollowRsiMax) + '</div>';
        if (!drift.length) return line;
        return line + '<div class="banner" style="border-color:var(--yellow);color:var(--yellow)">'
          + '<strong>THIS RAN UNDER NON-DEFAULT RSI CEILINGS:</strong> ' + esc(drift.join(', '))
          + '. Those decide WHICH TRADES EXIST, so this report is not comparable with one run '
          + 'under different ceilings, however similar the params look.</div>';
      })(meta.engineConfig)
    + (meta.stale
        ? '<div class="banner" style="border-color:var(--red);color:var(--red);background:#1a0a0a">'
          + '<strong>THIS REPORT IS STALE.</strong> It was computed '
          + (meta.ageHours / 24).toFixed(1) + ' days ago, past the ' + (meta.staleAfterHours / 24)
          + '-day mark. It is still the best evidence available and is shown in full, but it '
          + 'does not include anything that has closed since. Regenerate with '
          + '<code>node tasks/montecarlo_report.cjs</code>.</div>'
        : '')

    + '<div class="banner"><strong>READ THIS FIRST.</strong> These are <strong>REPLAYED</strong> trades, '
    + 'not live fills — this system has ' + (meta.liveClosedTrades === undefined ? 'very few' : meta.liveClosedTrades)
    + ' closed live trades, which cannot produce a drawdown '
    + 'distribution that means anything. And a bootstrap resamples the <strong>same</strong> trades: it shows '
    + 'the range of <strong>luck around an edge</strong>, it does <strong>not</strong> test whether the edge '
    + 'survives out of sample. That is a different question, answered on the Strategy page by the '
    + 'walk-forward cuts and PBO.</div>'

    + '<div class="stats">'
    + stat(s.chanceOfProfit.toFixed(1) + "%", "chance of profit", s.chanceOfProfit >= 50 ? "var(--green)" : "var(--red)")
    + stat(f1(s.p5ReturnPct) + "%  …  " + f1(s.p95ReturnPct) + "%", "90% of end returns land between", "var(--text)")
    + stat(f1(s.p50ReturnPct) + "%", "median simulated return", s.p50ReturnPct >= 0 ? "var(--green)" : "var(--red)")
    + stat(s.medianMaxDDPct.toFixed(0) + "%", "typical max drawdown", "var(--yellow)")
    + stat(s.p95MaxDDPct.toFixed(0) + "%", "worst-case DD (95th pct)", "var(--red)")
    + '</div>'

    // THE SAME TRADES RESAMPLED IN BLOCKS, so losing streaks survive. The IID row above
    // shuffles trades independently and destroys ordering; this one preserves it. The
    // pair is the point - the gap between them is how much the independence assumption
    // is worth, and it is not assumed, it is shown.
    + (function(b){
        if (!b) return '';
        var worse = b.p95DDWorseThanIidPts;
        return '<div class="sub-line" style="margin-top:14px">block bootstrap · '
          + 'contiguous blocks of ~' + b.expectedBlockTrades + ' trades, so losing streaks survive</div>'
          + '<div class="stats">'
          + stat(b.chanceOfProfit.toFixed(1) + '%', 'chance of profit (blocks)', b.chanceOfProfit >= 50 ? 'var(--green)' : 'var(--red)')
          + stat(f1(b.p50ReturnPct) + '%', 'median return (blocks)', b.p50ReturnPct >= 0 ? 'var(--green)' : 'var(--red)')
          + stat(b.medianMaxDDPct.toFixed(0) + '%', 'typical max DD (blocks)', 'var(--yellow)')
          + stat(b.p95MaxDDPct.toFixed(0) + '%', 'worst-case DD (blocks)', 'var(--red)')
          + stat((worse >= 0 ? '+' : '') + worse.toFixed(1) + ' pts', 'block p95 DD vs IID', worse > 0 ? 'var(--red)' : 'var(--green)')
          + '</div>'
          + '<div class="sub-line">' + esc(b.note) + '</div>';
      })(meta.blockSimulated)

    // SEARCH-BIAS CORRECTION. Everything above measures luck in the DRAW - how the same
    // trades could have fallen in a different order. This measures luck in the SEARCH:
    // this project has swept RSI ceilings, gates, MIN_RR, stop variants, cohort floors
    // and hold horizons, and the best of N trials is biased upward by construction.
    // Without it the page reports a backtest's significance while ignoring how many
    // times the backtest was re-run to find it.
    + (function(sr){
        if (!sr) return '';
        if (!sr.available) {
          return '<div class="sub-line" style="margin-top:14px">search-bias correction: '
            + esc(sr.why || 'not generated yet') + '</div>';
        }
        var d = sr.deflated || {};
        var dsr = (sr.dsr != null ? sr.dsr : d.dsr);
        var survives = dsr != null && dsr >= 0.95;
        var pc = function(x){ return x == null ? 'n/a' : (x * 100).toFixed(1) + '%'; };
        var trl = sr.minTrackRecordLength == null ? null : Math.ceil(sr.minTrackRecordLength);
        return '<div class="sub-line" style="margin-top:14px">search-bias correction · '
            + 'Deflated Sharpe and Minimum Track Record Length (Bailey &amp; López de Prado)</div>'
          + '<div class="stats">'
          + stat(Number(sr.sharpePerTrade).toFixed(3), 'Sharpe per trade', 'var(--text)')
          + stat(pc(sr.psr), 'PSR vs zero', sr.psr >= 0.95 ? 'var(--green)' : 'var(--yellow)')
          + stat(String(d.trialsAssumed), 'configurations tried', 'var(--muted)')
          + stat(pc(dsr), 'DEFLATED Sharpe', survives ? 'var(--green)' : 'var(--red)')
          + stat(trl == null ? 'n/a' : trl, 'trades needed (MinTRL 95%)', 'var(--yellow)')
          + '</div>'
          + '<div class="banner" style="border-color:' + (survives ? 'var(--green)' : 'var(--red)')
            + ';color:' + (survives ? 'var(--green)' : 'var(--red)')
            + ';background:' + (survives ? '#0a160a' : '#1a0a0a') + '">'
            + '<strong>' + esc(sr.verdict || '') + '</strong> '
            + 'PSR says the backtest beats zero with ' + pc(sr.psr) + ' confidence. After correcting for '
            + esc(String(d.trialsAssumed)) + ' configurations tried, that falls to ' + pc(dsr) + ' — '
            + 'the bar the best of ' + esc(String(d.trialsAssumed)) + ' random trials would clear is a Sharpe of '
            + Number(d.expectedMaxSharpe).toFixed(3) + ' against the observed '
            + Number(sr.sharpePerTrade).toFixed(3) + '.'
            + (trl == null ? '' : ' <strong>' + trl + ' trades</strong> are needed before this Sharpe is '
              + 'distinguishable from zero at 95%; there are ' + esc(String(meta.liveClosedTrades)) + ' closed live trades.')
            + '</div>'
          + '<div class="sub-line">' + (sr.caveats || []).map(esc).join(' · ') + '</div>';
      })(meta.sharpeRobustness)

    + '<div class="grid2">'
    +   '<div class="card"><div class="card-head"><span>Monte-Carlo equity fan</span>'
    +     '<span class="sub">every path is the same edge, reshuffled by luck</span></div>'
    +     '<div class="card-body">' + fanSvg(d.fan)
    +       '<div class="sub-line"><span style="color:#eab308">▬</span> actual &nbsp; '
    +       '<span style="color:#e2e8f0">▬</span> median path &nbsp; '
    +       '<span style="color:#3b82f6">▬</span> 25–75% and 5–95% of outcomes</div>'
    +     '</div></div>'
    +   '<div class="card"><div class="card-head"><span>Monthly return (%)</span>'
    +     '<span class="sub">the actual replayed path</span></div>'
    +     '<div class="card-body">' + heat(d.monthly) + '</div></div>'
    + '</div>'

    + '<div class="grid3">'
    +   histCard("Where does the account end up?", d.histograms.finalReturn, "#22c55e", a.returnPct, "%")
    +   histCard("How deep are the drawdowns?", d.histograms.maxDrawdown, "#ef4444", a.maxDDPct, "%")
    +   histCard("Every trade's outcome · " + d.trades + " trades", d.histograms.perTradeR, "#a78bfa", d.avgR, "R")
    + '</div>'

    + '<div class="card"><div class="card-head"><span>What this run actually was</span></div>'
    +   '<div class="card-body"><div class="note">'
    +     '<strong>Source:</strong> ' + esc(d.source) + '<br>'
    +     '<strong>Edge:</strong> ' + d.avgR.toFixed(3) + 'R per trade over ' + d.trades
    +       + ' trades, ' + d.winRate.toFixed(1) + '% win rate. Actual path '
    +       + f1(a.returnPct) + '% with a ' + a.maxDDPct.toFixed(1) + '% max drawdown.<br>'
    +     d.caveats.map(function(c){ return "• " + esc(c); }).join("<br>")
    +   '</div></div></div>';

  document.getElementById("root").innerHTML = html;
}

function stat(v, l, colour) {
  return '<div class="stat"><div class="v" style="color:' + colour + '">' + v + '</div>'
       + '<div class="l">' + esc(l) + '</div></div>';
}
function histCard(title, h, colour, actual, unit) {
  return '<div class="card"><div class="card-head"><span>' + esc(title) + '</span></div>'
       + '<div class="card-body">' + histSvg(h, colour, actual, unit) + '</div></div>';
}

// ── CPCV: the out-of-sample DISTRIBUTION ─────────────────────────────────────
//
// Everything else on this page resamples the SAME trades - a bootstrap shows the range
// of luck around an edge, and says nothing about whether the edge survives out of
// sample. The walk-forwards answer that, but each gives ONE path, and this system's own
// record shows verdict after verdict turning on a single fold.
//
// CPCV gives a distribution of out-of-sample paths, with training trades PURGED when
// their life overlaps a test block and EMBARGOED when they start just after one. The
// existing pbo.cjs runs CSCV, which does neither.
function renderCPCV(c) {
  if (!c || c.status === "NOT RUN") {
    return '<div class="card"><div class="card-head"><span>Out-of-sample distribution (CPCV)</span></div>'
      + '<div class="card-body"><div class="loading">Not run yet — <code>node tasks/cpcv.cjs</code></div></div></div>';
  }
  if (c.status && c.status !== "OK") {
    return '<div class="card"><div class="card-head"><span>Out-of-sample distribution (CPCV)</span></div>'
      + '<div class="card-body"><div class="loading" style="color:var(--red)">' + esc(c.detail || c.status) + '</div></div></div>';
  }
  var f = function (n) { return (n === null || n === undefined) ? '—' : (n >= 0 ? '+' : '') + Number(n).toFixed(4); };
  var pct = c.pathsPositivePct;
  var tone = pct >= 80 ? '#7ee2a8' : pct >= 60 ? '#e8ce6a' : '#f5a3a3';
  // DEGRADATION IS THE HEADLINE, not the positive share. A strategy that only works
  // where it was fitted shows a large positive in-sample-minus-out-of-sample gap; a
  // real edge shows a gap near zero. That single number is what overfitting looks like.
  var deg = c.degradationR;
  var degTone = deg === null || deg === undefined ? 'var(--muted)'
              : deg > 0.15 ? '#f5a3a3' : deg > 0.05 ? '#e8ce6a' : '#7ee2a8';
  return '<div class="card"><div class="card-head"><span>Out-of-sample distribution (CPCV)</span>'
    + '<span style="color:var(--muted);font-weight:400">' + c.paths + ' paths · purged &amp; embargoed</span></div>'
    + '<div class="card-body">'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">'
    + '<div><div style="font-size:1.5rem;font-weight:800;color:' + tone + '">' + pct + '%</div>'
    + '<div style="font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">paths profitable (' + c.pathsPositive + '/' + c.paths + ')</div></div>'
    + '<div><div style="font-size:1.5rem;font-weight:800;color:' + degTone + '">' + f(deg) + '</div>'
    + '<div style="font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">in-sample minus out-of-sample R</div></div>'
    + '<div><div style="font-size:1.5rem;font-weight:800">' + f(c.testMeanR && c.testMeanR.p50) + '</div>'
    + '<div style="font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">median OOS R/trade</div></div>'
    + '<div><div style="font-size:1.5rem;font-weight:800">' + f(c.worstPath && c.worstPath.testMeanR) + '</div>'
    + '<div style="font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">worst path R/trade</div></div>'
    + '</div>'
    + '<div style="font-size:.72rem;color:var(--muted);line-height:1.6">'
    + 'OOS R/trade across all splits: p5 <strong>' + f(c.testMeanR && c.testMeanR.p5) + '</strong>'
    + ' · p50 <strong>' + f(c.testMeanR && c.testMeanR.p50) + '</strong>'
    + ' · p95 <strong>' + f(c.testMeanR && c.testMeanR.p95) + '</strong>. '
    + c.avgPurgedPerSplit + ' training trades purged per split (embargo ' + Math.round((c.embargoPct || 0) * 100) + '%), '
    + 'because a trade that opens in training and closes inside the test window was partly decided by data '
    + 'the test is supposed to judge blind. '
    + '<strong>The degradation number is the one to read:</strong> near zero means the edge is not an artifact '
    + 'of where it was fitted. A 5-fold walk-forward reports one of these ' + c.paths + ' paths and calls it the answer.'
    + (c.horizonMatchesLive === false ? ' <span style="color:var(--red)">Computed at MAX_HOLD=' + c.maxHoldBars + ', which does not match live.</span>' : '')
    + '</div></div></div>';
}

fetch("/api/robustness-report")
  .then(function(r){
    if (r.status === 401) throw new Error("Not logged in — open /login first.");
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(d){
    if (d.status && d.status !== "OK") {
      document.getElementById("root").innerHTML =
        '<div class="loading">' + esc(d.detail || d.status) + '<br><br>'
        + 'Generate it with <code>node tasks/montecarlo_report.cjs</code></div>';
      document.getElementById("hdr-meta").textContent = d.status;
      return;
    }
    // The envelope carries the age, the stale verdict and the live trade count;
    // the report itself carries none of them. Pass both.
    render(d.report, d);
    // CPCV is fetched SEPARATELY and appended, so a missing or broken CPCV report can
    // never blank the Monte-Carlo page. Two independent reports, two independent
    // failures - the whole page going dark because a secondary artifact is absent is
    // the failure mode this split avoids.
    fetch("/api/cpcv-report")
      .then(function (r) { return r.ok ? r.json() : { status: "ERROR", detail: "HTTP " + r.status }; })
      .catch(function (e) { return { status: "ERROR", detail: e.message }; })
      .then(function (c) {
        var host = document.createElement("div");
        host.innerHTML = renderCPCV(c);
        document.getElementById("root").appendChild(host.firstChild);
      });
  })
  .catch(function(e){
    console.error("robustness-report:", e);
    document.getElementById("root").innerHTML =
      '<div class="loading" style="color:var(--red)">Could not load: ' + esc(e.message) + '</div>';
    document.getElementById("hdr-meta").textContent = "unreachable";
  });
</script>
</body>
</html>
